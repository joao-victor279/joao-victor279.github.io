<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form id="id_formulario">
        <fieldset>
            <legend>Cadastro</legend>

            <label for="id_nome">Nome
                <input 
                type="text"
                id="id_nome"
                placeholder="Informe seu nome"
                required
                >
            </label><br>
            
            <label for="id_matricula">Matrícula
                <input 
                type="number"
                id="id_matricula"
                placeholder="Informe sua matrícula"
                required
                >
            </label><br>

            <button type="submit">Cadastrar</button>
            <input type="button" value="Listar">
        </fieldset>
    </form>

    <div>
        <fieldset>
            <legend>Cadastrados</legend>
            <div id="id_cadastrados"></div>
        </fieldset>
    </div>

    <link rel="stylesheet" href="paulo.css">
    <script src="desconstroi.js"></script>
</body>
</html>
